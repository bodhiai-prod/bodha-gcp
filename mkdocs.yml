site_name: Bodha AI Technical Documentation
site_description: Engineering and operations documentation for Bodha AI.
site_url: https://docs.bodhaai.app
repo_name: Bodha AI
docs_dir: docs
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - guide/assets/mermaid-init.js

nav:
  - Home: index.md
  - Overview:
      - Introduction: guide/overview.md
      - Repository map: guide/repository.md
      - User journeys: guide/user-journeys.md
  - Architecture:
      - System architecture: guide/architecture.md
      - Technical architecture reference: guide/technical-architecture-reference.md
      - Generation lifecycle: guide/generation.md
      - Data and security: guide/data-security.md
  - Development:
      - Local development: guide/development.md
      - Testing: guide/testing.md
  - Application:
      - Backend: guide/backend.md
      - Frontend: guide/frontend.md
      - Teacher workflow deep dive: guide/teacher-workflow.md
      - Student and admin workflows: guide/student-admin-workflows.md
  - API reference:
      - Conventions: guide/api/conventions.md
      - Identity and configuration: guide/api/identity.md
      - Content and papers: guide/api/papers.md
      - Student, competitive, and admin: guide/api/specialized.md
  - Operations:
      - Runtime and deployment: guide/operations.md
      - Configuration reference: guide/configuration.md
      - Troubleshooting: guide/troubleshooting.md
