services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-/run/bodha/backend.env}
    volumes:
      - /srv/bodha/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: journald

  paper-review-worker:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    restart: unless-stopped
    command: ["python", "-m", "paper_review_worker"]
    env_file:
      - ${BACKEND_ENV_FILE:-/run/bodha/backend.env}
    volumes:
      - /srv/bodha/logs:/app/logs
    logging:
      driver: journald

  web:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /srv/bodha/caddy/data:/data
      - /srv/bodha/caddy/config:/config
    logging:
      driver: journald
