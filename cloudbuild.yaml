substitutions:
  _REGION: asia-south1
  _REPOSITORY: bodha
  _VM_NAME: bodha-prod
  _VM_ZONE: asia-south1-a
  # Firebase Web configuration is public client-side configuration, not a
  # credential. Keeping it here makes production builds reproducible and
  # avoids accidental empty values from a manually entered substitution.
  _FIREBASE_API_KEY: "AIzaSyBQ2GHQuGybTbm7OIPa7-zJ57ZFL9ImCF0"
  _FIREBASE_AUTH_DOMAIN: "bodha-ai-prod.firebaseapp.com"
  _FIREBASE_APP_ID: "1:102946766569:web:80504ce59806b026823a78"

# Use the least-privilege account provisioned by Terraform.  Without this,
# manual submissions use the default Compute Engine account, which cannot push
# release images or write build logs.
serviceAccount: projects/bodha-ai-prod/serviceAccounts/bodha-prod-build@bodha-ai-prod.iam.gserviceaccount.com

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$BUILD_ID", "backend"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "REACT_APP_BACKEND_URL=", "--build-arg", "REACT_APP_FIREBASE_API_KEY=${_FIREBASE_API_KEY}", "--build-arg", "REACT_APP_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}", "--build-arg", "REACT_APP_FIREBASE_PROJECT_ID=$PROJECT_ID", "--build-arg", "REACT_APP_FIREBASE_APP_ID=${_FIREBASE_APP_ID}", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$BUILD_ID", "frontend"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$BUILD_ID"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$BUILD_ID"]
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - compute
      - scp
      - deploy/vm/bodha-deploy
      - ${_VM_NAME}:/tmp/bodha-deploy
      - --zone=${_VM_ZONE}
      - --tunnel-through-iap
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - compute
      - scp
      - deploy/docker-compose.gcp.yml
      - ${_VM_NAME}:/tmp/bodha-compose-$BUILD_ID.yml
      - --zone=${_VM_ZONE}
      - --tunnel-through-iap
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - compute
      - ssh
      - ${_VM_NAME}
      - --zone=${_VM_ZONE}
      - --tunnel-through-iap
      - --command=sudo install -m 0755 /tmp/bodha-deploy /usr/local/bin/bodha-deploy && sudo install -m 0644 /tmp/bodha-compose-$BUILD_ID.yml /srv/bodha/docker-compose.gcp.yml && sudo /usr/local/bin/bodha-deploy $BUILD_ID

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/backend:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
